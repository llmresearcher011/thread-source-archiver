[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aethermind-source-archiver"
version = "0.1.0"
description = "Open-source toolkit for turning public research-link threads into AI-ready source manifests."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AetherMind contributors"}]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.1"
]

[tool.setuptools.packages.find]
where = ["src"]
